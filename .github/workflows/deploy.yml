name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          # Vite inlines VITE_* at build time, so the deployed bundle needs this
          # here rather than at runtime. A repository *variable*, not a secret:
          # an OAuth client id for a public client ships inside the bundle and is
          # public by design. Empty until one is set, which the app handles - the
          # Drive panel reports the transport as unavailable instead of offering
          # a button that cannot work.
          # Falls back to a secret of the same name. `vars.` cannot see a secret,
          # and a value saved in the wrong tab resolves to an empty string with
          # no warning anywhere - which cost an afternoon once already.
          VITE_DRIVE_OAUTH_CLIENT_ID: ${{ vars.VITE_DRIVE_OAUTH_CLIENT_ID || secrets.VITE_DRIVE_OAUTH_CLIENT_ID }}

      # Publishes what the build actually received, so a misconfigured value can
      # be diagnosed by fetching a file rather than by reading Actions logs.
      # Records presence and length only - never the value, which would defeat
      # the masking if it ever did come from a secret.
      - name: Record build provenance
        run: |
          NAMES=$(echo "$ALL_VARS" | jq -c 'keys' 2>/dev/null || echo '["unreadable"]')
          printf '{"commit":"%s","builtAt":"%s","idLength":%s,"varNames":%s}\n' \
            "$GITHUB_SHA" "$(date -u +%FT%TZ)" "${#RESOLVED}" "$NAMES" \
            > dist/build-info.json
          cat dist/build-info.json
        env:
          # Variable NAMES only, never values, and deliberately not the secrets
          # context - dumping that is both risky and unnecessary, since a value
          # in either tab already shows up in idLength.
          ALL_VARS: ${{ toJSON(vars) }}
          RESOLVED: ${{ vars.VITE_DRIVE_OAUTH_CLIENT_ID || secrets.VITE_DRIVE_OAUTH_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
