name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          # Vite inlines VITE_* at build time, so the deployed bundle needs this
          # here rather than at runtime. A repository *variable*, not a secret:
          # an OAuth client id for a public client ships inside the bundle and is
          # public by design. Empty until one is set, which the app handles - the
          # Drive panel reports the transport as unavailable instead of offering
          # a button that cannot work.
          # Falls back to a secret of the same name. `vars.` cannot see a secret,
          # and a value saved in the wrong tab resolves to an empty string with
          # no warning anywhere - which cost an afternoon once already.
          #
          # This one lives under Settings -> Environments -> github-pages rather
          # than as a repository variable, which works because this job declares
          # that environment. Worth knowing if it ever looks missing again:
          # `toJSON(vars)` does NOT enumerate environment-scoped variables, so a
          # dump of the context comes back empty while `vars.NAME` reads fine.
          # Enumeration and direct access disagree; trust the direct read.
          VITE_DRIVE_OAUTH_CLIENT_ID: ${{ vars.VITE_DRIVE_OAUTH_CLIENT_ID || secrets.VITE_DRIVE_OAUTH_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
