name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

# Every action here is pinned to a major that runs on Node 24.
#
# They were all on majors targeting Node 20, which the runners had begun
# force-migrating to Node 24 and warning about on every run. The warning was
# the only symptom - the deploy still passed - but a forced runtime is a
# deprecation with a deadline attached, and the version to find that out on is
# not the one carrying a release.
#
# `actions/upload-artifact` appears in that warning without appearing here:
# `upload-pages-artifact` delegates to it internally, so bumping the wrapper is
# what moves it.
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # The Node that builds the bundle, which is a different thing from the
          # Node the actions themselves run on - and it was pinned to a release
          # that has since gone end-of-life. 24 is what the project is developed
          # and verified on locally, so this closes a gap where CI could have
          # built on a runtime nobody had run the app against.
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
        env:
          # Vite inlines VITE_* at build time, so the deployed bundle needs this
          # here rather than at runtime. A repository *variable*, not a secret:
          # an OAuth client id for a public client ships inside the bundle and is
          # public by design. Empty until one is set, which the app handles - the
          # Drive panel reports the transport as unavailable instead of offering
          # a button that cannot work.
          # Falls back to a secret of the same name. `vars.` cannot see a secret,
          # and a value saved in the wrong tab resolves to an empty string with
          # no warning anywhere - which cost an afternoon once already.
          #
          # This one lives under Settings -> Environments -> github-pages rather
          # than as a repository variable, which works because this job declares
          # that environment. Worth knowing if it ever looks missing again:
          # `toJSON(vars)` does NOT enumerate environment-scoped variables, so a
          # dump of the context comes back empty while `vars.NAME` reads fine.
          # Enumeration and direct access disagree; trust the direct read.
          VITE_DRIVE_OAUTH_CLIENT_ID: ${{ vars.VITE_DRIVE_OAUTH_CLIENT_ID || secrets.VITE_DRIVE_OAUTH_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
